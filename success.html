<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout received — MRG</title>
  <style>
    :root { --bg:#09090b; --card:#18181b; --text:#fafafa; --muted:#a1a1aa; --accent:#22c55e; --border:#27272a; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:2.25rem; max-width:440px; text-align:center; }
    h1 { font-size:1.4rem; margin:0 0 0.75rem; }
    p { color:var(--muted); margin:0 0 1.25rem; line-height:1.5; font-size:0.95rem; }
    a.btn { display:inline-block; background:var(--accent); color:#052e16; font-weight:600; padding:0.65rem 1.2rem; border-radius:8px; text-decoration:none; }
    .note { font-size:0.8rem; color:var(--muted); margin-top:1.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Checkout session received</h1>
    <p>
      If you completed payment with Stripe, activation follows a verified webhook event.
      This page alone does not confirm that a charge succeeded or that a license is active.
    </p>
    <a class="btn" href="/">Return to allocation</a>
    <p class="note">Session reference is provided by Stripe on redirect when configured.</p>
  </div>
</body>
</html>
