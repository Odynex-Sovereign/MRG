# fly.toml

app = "mrg"
primary_region = "atl"

[build]
  image = "registry.fly.io/mrg:deployment-8a707042e108d9ee6cbe136e10ccfc19"

[env]
  ENVIRONMENT = "production"
  PORT = "8000"
  APP_BASE_URL = "https://fly.dev"

# SUCCESSFUL TECH MECHANISM: Automatically updates schemas on every build push
[deploy]
  release_command = "python database/db_client.py"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.concurrency]]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.http_checks]]
    interval = "10s"
    grace_period = "5s"
    method = "get"
    path = "/healthz"
    protocol = "http"
    timeout = "2s"
