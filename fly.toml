app = "mrg-simulation-grid"
primary_region = "atl"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  CORE_STRATEGY_ENGINE = "ODYNEX_AXIS_LOGISTICS"
  LEGAL_PROTECTION_FRAMEWORK = "TUTSA_WTO_COMPLIANT"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "20s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "3s"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800
