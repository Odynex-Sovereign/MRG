version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis_cache:6379/0
      - DATABASE_URL=sqlite:///./mrg_prod.db
    depends_on:
      - redis_cache
    networks:
      - mrg_network
  redis_cache:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    networks:
      - mrg_network
networks:
  mrg_network:
    driver: bridge
