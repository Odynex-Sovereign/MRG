version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis_cache:6379/0
      - DATABASE_URL=postgresql://mrg_user:mrg_secure_pass@postgres_db:5432/mrg_prod
    depends_on:
      - redis_cache
      - postgres_db
    networks:
      - mrg_network

  redis_cache:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - mrg_network

  postgres_db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mrg_user
      - POSTGRES_PASSWORD=mrg_secure_pass
      - POSTGRES_DB=mrg_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mrg_network

volumes:
  redis_data:
  postgres_data:

networks:
  mrg_network:
    driver: bridge
