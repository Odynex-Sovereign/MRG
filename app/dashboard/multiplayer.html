<!-- Roblox-Style Coop Matrix Portal -->
<div id="mrg-multiplayer-hub" style="font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; border-radius: 8px; border: 2px solid #8b5cf6; max-width: 500px; margin: 20px auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px;">
        <h3 style="margin: 0; color: #a78bfa;">🎮 MRG Multi-User Grid Mesh</h3>
        <span id="network-mesh-status" style="background: #3b82f6; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold;">LAN SEARCHING</span>
    </div>

    <!-- Interface Section: Host an active session -->
    <div style="margin-top: 15px; padding: 15px; background: #1e293b; border-radius: 6px;">
        <h4 style="margin: 0 0 10px 0; color: #38bdf8;">👑 Host Collaborative Canvas</h4>
        <button onclick="spinUpMultiplayerLobby()" style="background: #8b5cf6; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%;">START HOST STREAM</button>
        <div id="host-code-display" style="display: none; margin-top: 10px; text-align: center; background: #020617; padding: 8px; border-radius: 4px;">
            <span style="font-size: 12px; color: #94a3b8;">SHARE ROOM PIN CODE:</span>
            <h2 id="live-room-pin" style="margin: 5px 0; color: #f59e0b; letter-spacing: 4px;">000000</h2>
        </div>
    </div>

    <!-- Interface Section: Hop into an active session -->
    <div style="margin-top: 15px; padding: 15px; background: #1e293b; border-radius: 6px;">
        <h4 style="margin: 0 0 10px 0; color: #fb7185;">🕹️ Hot-Join Active Simulation</h4>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="input-target-room" placeholder="Room ID" style="flex-grow: 1; background: #020617; border: 1px solid #334155; padding: 8px; border-radius: 4px; color: #fff;">
            <input type="text" id="input-target-pin" placeholder="6-Digit PIN" maxlength="6" style="width: 100px; background: #020617; border: 1px solid #334155; padding: 8px; border-radius: 4px; color: #fff; text-align: center;">
        </div>
        <button onclick="requestLobbyJoin()" style="margin-top: 10px; background: #22c55e; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%;">CONNECT TO PLAYER MESH</button>
    </div>
    <div id="multiplayer-readout-box" style="margin-top: 12px; font-size: 13px; text-align: center; color: #94a3b8;"></div>
</div>

<script>
async function spinUpMultiplayerLobby() {
    const feedback = document.getElementById('multiplayer-readout-box');
    try {
        const response = await fetch('/api/multiplayer/create-lobby', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ owner_id: "user_dev_local", is_public: true })
        });
        const data = await response.json();
        
        document.getElementById('host-code-display').style.display = 'block';
        document.getElementById('live-room-pin').innerText = data.join_pin;
        document.getElementById('network-mesh-status').style.background = "#8b5cf6";
        document.getElementById('network-mesh-status').innerText = `HOSTING: ${data.session_id}`;
        feedback.innerText = "Lobby open! Standing by for authorized players to enter the mesh room...";
    } catch (err) {
        feedback.innerText = "Failed to synchronize multiplayer framework gateway.";
    }
}

async function requestLobbyJoin() {
    const feedback = document.getElementById('multiplayer-readout-box');
    const roomId = document.getElementById('input-target-room').value;
    const roomPin = document.getElementById('input-target-pin').value;

    if (!roomId || !roomPin) {
        feedback.innerText = "Please input valid Room ID and PIN fields.";
        return;
    }

    try {
        const response = await fetch('/api/multiplayer/join-lobby', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ guest_id: "guest_player_node", room_pin: roomPin, room_id: roomId })
        });
        const state = await response.json();

        if (response.ok) {
            feedback.style.color = "#22c55e";
            feedback.innerText = "Connected! Loading shared canvas workspace mesh...";
            document.getElementById('network-mesh-status').style.background = "#22c55e";
            document.getElementById('network-mesh-status').innerText = "CONNECTED GUEST";
        } else {
            feedback.style.color = "#ef4444";
            feedback.innerText = `Join Refused: ${state.detail}`;
        }
    } catch (err) {
        feedback.innerText = "Connection loop exception occurred.";
    }
}
</script>
