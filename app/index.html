<script src="https://braintreegateway.com"></script>

<!-- The Alternative Checkout Container Space -->
<div id="mrg-checkout-container" style="max-width: 400px; margin: 20px auto; text-align: center;">
    <h3>Select Alternative Checkout Option</h3>
    <div id="paypal-button-target"></div>
    <div id="payment-status-message" style="margin-top: 15px; font-weight: bold;"></div>
</div>

<script>
async function initializeAlternativeCheckout() {
    const statusDiv = document.getElementById('payment-status-message');
    const simulationCost = 499.00; // Define variable simulation bundle cost rate dynamically

    try {
        // 1. Request secure client authorization token from FastAPI backend
        const tokenResponse = await fetch('/api/payments/paypal-token');
        if (!tokenResponse.ok) throw new Error("Could not fetch secure initialization credentials.");
        const { client_token } = await tokenResponse.json();

        // 2. Initialize Braintree Core SDK Instance
        const clientInstance = await new Promise((resolve, reject) => {
            braintree.client.create({ authorization: client_token }, (err, inst) => err ? reject(err) : resolve(inst));
        });

        // 3. Initialize PayPal Smart Buttons Layer
        const paypalInstance = await new Promise((resolve, reject) => {
            braintree.paypalCheckout.create({ client: clientInstance }, (err, inst) => err ? reject(err) : resolve(inst));
        });

        // 4. Render the official button interface into user layout space
        paypal.Button.render({
            env: 'sandbox', // Toggle to 'production' via client variables when live
            style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'paypal' },

            payment: function () {
                return paypalInstance.createPayment({
                    flow: 'checkout',
                    amount: simulationCost,
                    currency: 'USD',
                    intent: 'capture'
                });
            },

            onAuthorize: function (data, actions) {
                return paypalInstance.tokenizePayment(data, async function (err, payload) {
                    if (err) {
                        statusDiv.innerText = "Authorization handling token failure.";
                        return;
                    }
                    
                    statusDiv.innerText = "Verifying funds with banking network...";
                    
                    // 5. Securely dispatch single-use nonce back to server to finalize the sale
                    const paymentResult = await fetch('/api/payments/paypal-checkout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            amount: simulationCost,
                            payment_method_nonce: payload.nonce
                        })
                    });

                    const checkoutState = await paymentResult.json();
                    if (paymentResult.ok && checkoutState.status === 'success') {
                        statusDiv.style.color = "green";
                        statusDiv.innerText = `Transaction Success! ID: ${checkoutState.transaction_id}`;
                        // Redirect client or unlock simulation sectors here
                    } else {
                        statusDiv.style.color = "red";
                        statusDiv.innerText = `Payment Refused: ${checkoutState.detail}`;
                    }
                });
            },

            onCancel: function () {
                statusDiv.innerText = "Checkout pipeline aborted by user.";
            },

            onError: function (err) {
                statusDiv.innerText = "A hardware interface processing loop fault occurred.";
                console.error(err);
            }
        }, '#paypal-button-target');

    } catch (error) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "Failed to launch alternative billing window loop UI.";
        console.error(error);
    }
}

// Fire rendering sequence on page layout frame readiness
document.addEventListener("DOMContentLoaded", initializeAlternativeCheckout);
        </script>
