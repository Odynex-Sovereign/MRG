name: MRG Production CI/CD
on:
  push:
    branches: [ main ]
jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt pytest flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest
