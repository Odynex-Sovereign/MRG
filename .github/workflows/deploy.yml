name: Deploy MRG Engine to Fly.io

on:
  push:
    branches:
      - main  # Triggers the pipeline automatically when you save changes to main

jobs:
  deploy:
    name: Build and Ship Premium Sensory Grid
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Fly.io CLI Environment
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build Container and Deploy to Fly Proxy
        # Fix: Stripped the --image flag completely to block stale remote overrides
        # The --no-cache flag forces Fly's depot to parse your new Dockerfile and requirements
        run: flyctl deploy --no-cache --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
