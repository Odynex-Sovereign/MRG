{% extends "base.html" %}
{% block title %}Contact — MRG{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="max-width:560px">
    <h1 class="section-title">Contact & feedback</h1>
    <p class="section-sub">Questions, institutional sales, or product feedback. We read every message.</p>

    <form id="feedback-form">
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="general">General</option>
          <option value="sales">Institutional sales</option>
          <option value="support">Support</option>
          <option value="security">Security</option>
          <option value="accessibility">Accessibility</option>
        </select>
      </div>
      <div class="form-group">
        <label for="email">Email (optional)</label>
        <input id="email" name="email" type="email" maxlength="200" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required maxlength="2000" placeholder="How can we help?"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
    <div id="form-result" class="mt-2" hidden></div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("feedback-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const result = document.getElementById("form-result");
  result.hidden = false;
  result.className = "alert alert-info";
  result.textContent = "Sending…";
  try {
    const res = await fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        category: document.getElementById("category").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Failed");
    result.className = "alert alert-success";
    result.textContent = data.message || "Thank you.";
    e.target.reset();
  } catch (err) {
    result.className = "alert alert-warning";
    result.textContent = err.message || "Something went wrong. Please try again.";
  }
});
</script>
{% endblock %}
