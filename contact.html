<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — MRG</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
<header class="site-header"><div class="container nav"><a class="logo" href="/">MRG <span>Grid</span></a></div></header>
<main id="main" class="container" style="padding:2.5rem 0;max-width:560px">
  <h1>Contact</h1>
  <p class="muted">Enterprise, investor, and support inquiries. Demo form returns acknowledgment only.</p>
  <form id="contact-form">
    <div class="form-group"><label for="name">Name</label><input id="name" required maxlength="120" /></div>
    <div class="form-group"><label for="email">Email</label><input id="email" type="email" required /></div>
    <div class="form-group"><label for="company">Company</label><input id="company" maxlength="200" /></div>
    <div class="form-group"><label for="intent">Intent</label>
      <select id="intent"><option value="enterprise">Enterprise sales</option><option value="investor">Investor</option><option value="support">Support</option><option value="general">General</option></select>
    </div>
    <div class="form-group"><label for="message">Message</label><textarea id="message" rows="5" required minlength="10" maxlength="4000"></textarea></div>
    <button class="btn btn-primary" type="submit">Send</button>
  </form>
  <div id="result" hidden class="mt-2"></div>
</main>
<script src="/assets/app.js" defer></script>
<script>
const intentQ = new URLSearchParams(location.search).get("intent");
if(intentQ) document.getElementById("intent").value = intentQ;
document.getElementById("contact-form").addEventListener("submit", async function(e){
  e.preventDefault();
  const body = {name:name.value.trim(),email:email.value.trim(),company:company.value.trim()||null,intent:intent.value,message:message.value.trim()};
  const r = await fetch("/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d = await r.json();
  const box = document.getElementById("result"); box.hidden=false;
  box.className = r.ok ? "alert alert-success mt-2" : "alert alert-error mt-2";
  box.textContent = r.ok ? (d.message+" Ref: "+d.reference) : (typeof d.detail==="string"?d.detail:JSON.stringify(d.detail));
});
</script>
</body>
</html>
