<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Sandbox Deck</title><link rel="stylesheet" href="/static/main.css"><script src="https://jsdelivr.net"></script></head>
<body style="padding:2rem;">
    <h2>Interactive Simulation Stream</h2>
    <button id="toggleStream" class="btn" style="width:auto; padding:0.75rem 2rem; background:#10b981;">Connect Stream</button>
    <div style="display:flex; gap:2rem; margin-top:2rem;">
        <div style="background:#111827; padding:1rem; border-radius:0.5rem; flex:1;"><canvas id="stressChart"></canvas></div>
    </div>
    <script>
        let ws = null, active = false;
        const ctx = document.getElementById('stressChart').getContext('2d');
        const chart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [{ label: 'Vocal Stress Index (%)', data: [], borderColor: '#38bdf8' }] } });
        document.getElementById('toggleStream').addEventListener('click', () => {
            if (active) { ws.close(); e.target.innerText = "Connect Stream"; } 
            else {
                ws = new WebSocket((window.location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + window.location.host + '/api/simulation/stream');
                ws.onmessage = (event) => {
                    const p = JSON.parse(event.data);
                    if(chart.data.labels.length > 15) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
                    chart.data.labels.push(new Date().toLocaleTimeString());
                    chart.data.datasets[0].data.push(p.telemetry.vocal_stress_index);
                    chart.update();
                };
                document.getElementById('toggleStream').innerText = "Disconnect Stream";
            }
            active = !active;
        });
    </script>
</body>
</html>
