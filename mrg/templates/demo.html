<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Telemetry Mesh — MRG Suite</title>
    <link rel="stylesheet" href="/static/main.css">
    <!-- Load Chart.js natively to handle canvas transformations -->
    <script src="https://jsdelivr.net"></script>
</head>
<body style="background-color: #0b0f19; padding: 2rem;">
    <main style="max-width: 1200px; margin: 0 auto;">
        <header style="border-bottom: 1px solid #1f2937; padding-bottom: 1rem; margin-bottom: 2rem;">
            <h1 style="color: #ffffff;">Operational Analytics Grid</h1>
            <p style="color: #9ca3af;">High-frequency data visualization reflecting NASDAQ/Siemens data serialization pipelines.</p>
        </header>

        <div style="margin-bottom: 2rem;">
            <button id="streamToggle" class="btn" style="width: auto; padding: 0.75rem 2rem; background: #10b981;">Initialize Analytics Stream</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
            <!-- Vocal Stress Timeline Chart -->
            <div style="background: #111827; border: 1px solid #1f2937; padding: 1.5rem; border-radius: 0.5rem;">
                <h3 style="color: #38bdf8; margin-top: 0;">Biometric Stress Core Tracker</h3>
                <canvas id="stressChart" width="400" height="200"></canvas>
            </div>

            <!-- Grid Stability Timeline Chart -->
            <div style="background: #111827; border: 1px solid #1f2937; padding: 1.5rem; border-radius: 0.5rem;">
                <h3 style="color: #fbbf24; margin-top: 0;">Siemens Digital Twin Integrity</h3>
                <canvas id="stabilityChart" width="400" height="200"></canvas>
            </div>
        </div>
    </main>

    <script>
        let ws = null;
        let isStreaming = false;
        const maxDataPoints = 20;

        // Initialize empty baseline configurations for Chart.js
        const createChartConfig = (label, color) => ({
            type: 'line',
            data: { labels: [], datasets: [{ label: label, data: [], borderColor: color, tension: 0.2, fill: false }] },
            options: { responsive: true, scales: { x: { display: false }, y: { beginAtZero: true } } }
        });

        const stressChart = new Chart(document.getElementById('stressChart'), createChartConfig('Vocal Stress Index (%)', '#38bdf8'));
        const stabilityChart = new Chart(document.getElementById('stabilityChart'), createChartConfig('Grid Stability (%)', '#fbbf24'));

        function appendChartData(chart, value) {
            const labels = chart.data.labels;
            const data = chart.data.datasets[0].data;

            if (labels.length >= maxDataPoints) { labels.shift(); data.shift(); }
            labels.push(new Date().toLocaleTimeString());
            data.push(value);
            chart.update('none'); // Update optimized frame tracking
        }

        document.getElementById('streamToggle').addEventListener('click', () => {
            if (isStreaming) {
                if (ws) ws.close();
                document.getElementById('streamToggle').innerText = "Initialize Analytics Stream";
                document.getElementById('streamToggle').style.background = "#10b981";
                isStreaming = false;
            } else {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${window.location.host}/api/simulation/stream`);
                
                ws.onmessage = (event) => {
                    const payload = JSON.parse(event.data);
                    if (payload.telemetry) appendChartData(stressChart, payload.telemetry.vocal_stress_index);
                    if (payload.macroGrid) appendChartData(stabilityChart, payload.macroGrid.grid_stability_index);
                };

                ws.onclose = () => {
                    isStreaming = false;
                    document.getElementById('streamToggle').innerText = "Initialize Analytics Stream";
                    document.getElementById('streamToggle').style.background = "#10b981";
                };

                document.getElementById('streamToggle').innerText = "Disconnect Active Stream";
                document.getElementById('streamToggle').style.background = "#ef4444";
                isStreaming = true;
            }
        });
    </script>
</body>
</html>
