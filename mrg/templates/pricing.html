<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Pricing</title><link rel="stylesheet" href="/static/main.css"></head>
<body>
    <main class="pricing-container">
        <h1>Select Your Access Tier</h1>
        <section class="pricing-grid">
            <div class="price-card"><h2>Free</h2><div class="price">$0</div><button class="btn" disabled>Active</button></div>
            <div class="price-card"><h2>Personal</h2><div class="price">$5</div><button class="btn checkout-btn" data-tier="Personal">Upgrade</button></div>
            <div class="price-card"><h2>Pro</h2><div class="price">$15</div><button class="btn checkout-btn" data-tier="Pro">Upgrade</button></div>
        </section>
    </main>
    <script>
        document.querySelectorAll('.checkout-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const tier = e.target.getAttribute('data-tier');
                const res = await fetch(`/api/billing/checkout?user_id=prod_user_01&plan_tier=${tier}`, { method: 'POST' });
                const data = await res.json();
                if (data.url) window.location.href = data.url;
            });
        });
    </script>
</body>
</html>
