<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Onboarding</title><link rel="stylesheet" href="/static/main.css"></head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
    <div style="background:#111827; padding:2.5rem; border-radius:0.5rem; max-width:500px; width:100%; border:1px solid #1f2937;">
        <h2>Profile Setup Wizard</h2>
        <input type="text" id="username" value="operator_01" style="width:100%; padding:0.75rem; margin:1rem 0; background:#1f2937; border:1px solid #374151; color:#fff;">
        <button id="authBtn" class="btn">Provisions Bearer Key</button>
        <p id="tokenDisplay" style="word-break:break-all; margin-top:1rem; font-family:monospace; color:#10b981;"></p>
        <a href="/demo" id="demoLink" class="btn" style="display:none; margin-top:1rem; background:#10b981;">Access Telemetry Deck</a>
    </div>
    <script>
        document.getElementById('authBtn').addEventListener('click', async () => {
            const u = document.getElementById('username').value;
            const res = await fetch('/api/auth/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ username: u, password: 'dev' }) });
            if(res.ok) {
                const d = await res.json();
                document.getElementById('tokenDisplay').innerText = "Bearer " + d.access_token;
                document.getElementById('demoLink').style.display = 'block';
            }
        });
    </script>
</body>
</html>
