<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>MRG Simulation Grid</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1020; color: #e5e7eb; }
    body { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    header, section { border: 1px solid #263248; border-radius: 12px; background: #111a2c; padding: 1.25rem; margin-bottom: 1rem; }
    h1 { margin: 0 0 .4rem; color: #5eead4; }
    p { color: #aab6c8; }
    #status { font-weight: 700; }
    textarea { box-sizing: border-box; width: 100%; min-height: 120px; resize: vertical; border: 1px solid #34445e; border-radius: 8px; padding: .8rem; color: inherit; background: #0b1020; }
    button { margin-top: .8rem; border: 0; border-radius: 8px; padding: .75rem 1rem; font-weight: 700; background: #2dd4bf; color: #07121b; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 5rem; color: #d1d5db; }
  </style>
</head>
<body>
  <header>
    <h1>MRG Simulation Grid</h1>
    <div>Service status: <span id="status">Connecting…</span></div>
    <p>Submit a scenario to the simulation service. Sandbox mode works without external model credentials.</p>
  </header>
  <section>
    <label for="scenario">Scenario prompt</label>
    <textarea id="scenario" placeholder="Describe a scenario to simulate…"></textarea>
    <button id="run" type="button" disabled>Connect to run simulation</button>
  </section>
  <section>
    <h2>Analysis</h2>
    <pre id="analysis">Waiting for a scenario.</pre>
    <div id="sensory"></div>
  </section>
  <section>
    <h2>Activity</h2>
    <pre id="log" aria-live="polite"></pre>
  </section>
  <script>
    const statusEl = document.getElementById('status');
    const runButton = document.getElementById('run');
    const analysisEl = document.getElementById('analysis');
    const sensoryEl = document.getElementById('sensory');
    const logEl = document.getElementById('log');
    const socketScheme = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${socketScheme}//${window.location.host}/ws/simulation`);

    function log(message) {
      logEl.textContent += `${new Date().toLocaleTimeString()} ${message}\n`;
    }

    socket.addEventListener('open', () => {
      statusEl.textContent = 'Connected';
      runButton.disabled = false;
      runButton.textContent = 'Run simulation';
      log('WebSocket connected.');
    });
    socket.addEventListener('close', () => {
      statusEl.textContent = 'Disconnected';
      runButton.disabled = true;
      log('WebSocket disconnected. Reload the page to reconnect.');
    });
    socket.addEventListener('error', () => {
      statusEl.textContent = 'Connection error';
      log('Could not connect to the simulation service.');
    });
    socket.addEventListener('message', (event) => {
      try {
        const message = JSON.parse(event.data);
        if (message.type === 'MACRO_COGNITIVE_UPDATE') {
          analysisEl.textContent = message.payload.analysis;
          log('Analysis received.');
        } else if (message.type === 'SENSORY_STREAM_INFO') {
          sensoryEl.textContent = `Sensory output: ${message.payload.audio_chunk_size} bytes (${message.payload.status}).`;
        } else if (message.type === 'SYSTEM_ERROR') {
          log(`Error: ${message.payload.message}`);
        } else if (message.type === 'SYSTEM_STATUS') {
          log(message.payload.message);
        }
      } catch (error) {
        log('Received an unreadable response.');
      }
    });

    runButton.addEventListener('click', () => {
      const prompt = document.getElementById('scenario').value.trim();
      if (!prompt) {
        analysisEl.textContent = 'Enter a scenario prompt first.';
        return;
      }
      analysisEl.textContent = 'Simulation running…';
      sensoryEl.textContent = '';
      socket.send(JSON.stringify({ action: 'TRIGGER_CRISIS', prompt }));
      log('Scenario submitted.');
    });
  </script>
</body>
</html>
